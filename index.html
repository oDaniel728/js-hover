<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover me!</title>

    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        :root {
            min-height: 90vh;
            margin: 1rem 2rem;
            font-size: 2rem;
            @apply 
                justify-center 
                items-center 
                flex;
            @apply
                bg-slate-800
                text-slate-300;
        }
        .hoverable
        {
            &:hover
            {
                @apply
                    transition-colors
                    cursor-pointer
                    text-slate-100;
            }
        }
        .bordered
        {
            @apply
                bg-slate-950
                px-1
                rounded-sm
                border-slate-500
                border-2
                font-mono
                text-center;
        }
        .bg-trans
        {
            @apply
                bg-black/50
                px-8 py-5
                rounded-xl;
        }
        .op-trans
        {
            transition: 100ms opacity ease-in-out;
        }
        .abs {
            position: absolute;
        }
        :root {
            --hover-offset-x: -10px;
            --hover-offset-y: -55px;
        }

        @media (max-width: 768px) {
            :root {
                --hover-offset-x: 10px;
                --hover-offset-y: 10px;
            }
        }

        .hover-tooltip {
            position: fixed;
            z-index: 9999;
            pointer-events: auto; /* Permite interação com o tooltip */
            transition: opacity 0.2s ease;
            word-wrap: break-word;
            @apply items-end text-left; 
        }

        .op-trans {
            transition: opacity 0.2s ease;
        }

        .abs {
            position: absolute;
        }

        .hoverable {
            cursor: help;
            position: relative;
        }

        .bordered {
            border: 1px solid #ccc;
        }

        h1 {
            @apply text-3xl;
        }
    </style>
</head>
<body>
    <div class="bg-trans">
        <p class="hover" hover="Yahoo!" follow>Hover me!</p>
        <p class="hover" hover="Hello,<br>World!">Hover me!(again)</p>
        
        <p class="hover" hover="
            <h1>hi!</h1>
            <img src='https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2Foriginals%2Fbd%2F2d%2F68%2Fbd2d682da1c92b9135f05d395cc0181a.jpg&f=1&nofb=1&ipt=a058158f1117ffa297234bd5dee4201d1a515466570b692a1f3cc775c40f7987'>
            <p>this is a test<p>
        ">html test</p>
    </div>
</body>
<script src="./scripts/index.js"></script>
</html>
